<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Screener</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
             box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 550px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            color: #1e293b;
        }

        .header svg {
            width: 28px;
            height: 28px;
            fill: #3b82f6;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.75rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .file-upload-wrapper {
            position: relative;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            background-color: #f8fafc;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .file-upload-wrapper:hover {
            border-color: #3b82f6;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-text {
            color: #64748b;
            font-size: 0.875rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: none;
            font-size: 0.95rem;
            color: #334155;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn-submit {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        <h1>Resume Screener</h1>
    </div>

    <form>
        <div class="form-group">
            <label>Upload Resume (PDF or DOCX)</label>
            <div class="file-upload-wrapper">
                <span class="upload-text">Click to upload or drag & drop</span>
                <input type="file" accept=".pdf,.docx">
            </div>
        </div>

        <div class="form-group">
            <label>Paste Job Description</label>
            <textarea placeholder="Paste the job description here..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Screen Resume</button>
    </form>
</div>



<script>
    async function screenResume() {
        const resumeFile = document.getElementById('resume').files[0];
        const jobDescription = document.getElementById('jobDescription').value;

        if (!resumeFile || !jobDescription) {
            alert('Please upload a resume and enter a job description.');
            return;
        }

        const formData = new FormData();
        formData.append('resume', resumeFile);
        formData.append('jobDescription', jobDescription);

        try {
            const response = await fetch('/api/screen', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error('Server returned an error: ' + response.status);
            }

            const data = await response.json();

            document.getElementById('scoreValue').textContent = data.similarityScore.toFixed(2);

            const matchedDiv = document.getElementById('matchedSkills');
            matchedDiv.innerHTML = '';
            if (data.matchedSkills.length === 0) {
                matchedDiv.innerHTML = '<em>None found</em>';
            } else {
                data.matchedSkills.forEach(skill => {
                    matchedDiv.innerHTML += `<span>${skill}</span>`;
                });
            }

            const missingDiv = document.getElementById('missingSkills');
            missingDiv.innerHTML = '';
            if (data.missingSkills.length === 0) {
                missingDiv.innerHTML = '<em>None — great match!</em>';
            } else {
                data.missingSkills.forEach(skill => {
                    missingDiv.innerHTML += `<span>${skill}</span>`;
                });
            }

            document.getElementById('result').style.display = 'block';
        } catch (err) {
            alert('Something went wrong: ' + err.message);
            console.error(err);
        }
    }
</script>

</body>
</html>
